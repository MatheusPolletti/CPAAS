[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
axum = "0.8.9"
dotenv = "0.15.0"
rand = "0.10.1"
rand_core = { version = "0.6", features = ["getrandom"]}
sea-orm = { version = "1.1.20", features = [ "sqlx-postgres", "runtime-tokio-native-tls", "macros" ] }
serde = { version= "1.0.228", features = [ "derive" ] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["full"] }
